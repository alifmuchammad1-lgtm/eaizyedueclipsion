    function loadData() {

        if (!raw) {

          localStorage.setItem(STORAGE_KEY, JSON.stringify(seed));
          return seed;
        }
        const parsed = JSON.parse(raw);
        return { ...createInitialSeedData(), ...parsed };
      } catch (err) {
        console.error('Gagal memuat data localStorage:', err);
        return createInitialSeedData();
      }
    }

        showToast('Penyimpanan lokal penuh atau dibatasi peramban.', 'error');

    function loadSession() {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (!raw) return { role: 'guest', name: 'Pengunjung', username: '', entered: false };
        const parsed = JSON.parse(raw);
        if (parsed && (parsed.role === 'admin' || parsed.role === 'member' || parsed.role === 'guest')) {
          return {
            role: parsed.role,
            name: parsed.name || (parsed.role === 'admin' ? 'Pengurus Admin XII ECLIPSION' : 'Pengunjung'),
            username: parsed.username || '',
            entered: Boolean(parsed.entered),
          };
        }
      } catch {
        // Fallback to guest
      }
      return { role: 'guest', name: 'Pengunjung', username: '', entered: false };
    }

    function recordActivity(actionText = null, options = {}) {
      if (typeof state === 'undefined' || !state.data) return;
      if (!hasEnteredPortal()) return;

      const actorName = (state.session?.name || 'Pengunjung').trim() || 'Pengunjung';
      const actorRole = state.session?.role || 'guest';
      const nowIso = new Date().toISOString();
      const currentPage = state.activePage || 'home';

      state.data.activityLogs = state.data.activityLogs || [];
      let entry = state.data.activityLogs.find(
        (item) => item.name.toLowerCase() === actorName.toLowerCase() && item.role === actorRole
      );

      if (!entry) {
        entry = {
          id: 'act-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
          name: actorName,
          role: actorRole,
          lastPage: currentPage,
          lastActiveAt: nowIso,
          lastAction: actionText || `Membuka halaman ${currentPage}`,
          visits: 1,
        };
        state.data.activityLogs.unshift(entry);
      } else {
        if (options.incrementVisit) {
          entry.visits = (Number(entry.visits) || 0) + 1;
        }
        entry.lastPage = currentPage;
        entry.lastActiveAt = nowIso;
        if (actionText) {
          entry.lastAction = actionText;
        }
      }

      if (state.data.activityLogs.length > 60) {
        state.data.activityLogs = state.data.activityLogs.slice(0, 60);
      }
      saveData();
    }

    function formatRelativeActivityTime(isoStr) {
      if (!isoStr) return 'Baru saja';
      const diffSec = Math.max(0, Math.floor((Date.now() - new Date(isoStr).getTime()) / 1000));
      if (diffSec < 60) return 'Aktif sekarang';
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin} menit lalu`;
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `${diffHr} jam lalu`;
      const diffDay = Math.floor(diffHr / 24);
      return `${diffDay} hari lalu`;
    }

    function getTaskActivitySummary() {
      const tasks = state.data.assignments || [];
      const memberTaskCounts = {};

      (state.data.members || []).forEach((m) => {
        memberTaskCounts[m] = { name: m, completedTitles: [], count: 0 };
      });

      tasks.forEach((t) => {
        (t.completedBy || []).forEach((person) => {
          if (!memberTaskCounts[person]) {
            memberTaskCounts[person] = { name: person, completedTitles: [], count: 0 };
          }
          memberTaskCounts[person].completedTitles.push(t.title);
          memberTaskCounts[person].count += 1;
        });
      });

      const activeTaskMembers = Object.values(memberTaskCounts)
        .filter((item) => item.count > 0)
        .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'id', { sensitivity: 'base' }));

      return {
        totalTasks: tasks.length,
        activeTaskMembers,
      };
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getTodayInfo() {
      const now = new Date();
      const dayIdx = now.getDay();
      const mapDay = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const todayName = mapDay[dayIdx] || 'Minggu';
      const tomorrowName = mapDay[(dayIdx + 1) % 7] || 'Senin';

      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      const isoDate = `${y}-${m}-${d}`;

      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      const liveTime = `${hh}:${mm}:${ss}`;

      const formattedDate = now.toLocaleDateString('id-ID', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric',
      });

      const offsetMin = -now.getTimezoneOffset();
      const tzAbbr =
        offsetMin === 420 ? 'WIB' : offsetMin === 480 ? 'WITA' : offsetMin === 540 ? 'WIT' : 'Lokal';

      return {
        now,
        todayName,
        tomorrowName,
        isoDate,
        liveTime,
        formattedDate,
        tzAbbr,
      };
    }

    function getRealtimeSessionContext(tomorrowName, tomorrowSchedules) {
      const now = new Date();
      const hour = now.getHours();
      if (hour < 7) {
        return { statusLabel: `Persiapan kelas • Jadwal besok (${tomorrowName}): ${tomorrowSchedules.length} sesi` };
      }
      if (hour < 15) {
        return { statusLabel: `Jam aktif KBM • Jadwal besok (${tomorrowName}): ${tomorrowSchedules.length} sesi` };
      }
      return { statusLabel: `Sesi sore/malam • Jadwal besok (${tomorrowName}): ${tomorrowSchedules.length} sesi` };
    }

      if (typeof state === 'undefined' || !state.data) return;
      const info = getTodayInfo();
      const tomorrowSchedules = (state.data.schedules || []).filter((s) => s.day === info.tomorrowName);
      const ctx = getRealtimeSessionContext(info.tomorrowName, tomorrowSchedules);

      document.querySelectorAll('[data-realtime-clock]').forEach((el) => {
        el.textContent = info.liveTime;
      });
      document.querySelectorAll('[data-realtime-date]').forEach((el) => {
        el.textContent = info.formattedDate;
      });
      document.querySelectorAll('[data-realtime-tz]').forEach((el) => {
        el.textContent = info.tzAbbr;
      });
      document.querySelectorAll('[data-realtime-session]').forEach((el) => {
        el.textContent = ctx.statusLabel;
      });
    }

    function exportBackupJson() {
      const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });

      const a = document.createElement('a');
      a.href = url;

      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup JSON berhasil diunduh.', 'success');
    }

    function importBackupJson(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || '{}'));
          state.data = { ...createInitialSeedData(), ...parsed };
          saveData();
          closeModal();
          renderAll();
          showToast('Data berhasil dipulihkan dari JSON.', 'success');
        } catch {
          showToast('File JSON tidak valid.', 'error');
        }
      };
      reader.readAsText(file);
    }

    function getMemberMonthRow(monthKey, memberName) {
      if (!state.data.kasByMonth[monthKey]) state.data.kasByMonth[monthKey] = {};
      if (!state.data.kasByMonth[monthKey][memberName]) {
        state.data.kasByMonth[monthKey][memberName] = { w1: 'tunggu', w2: 'tunggu', w3: 'tunggu', w4: 'tunggu' };
      }
      return state.data.kasByMonth[monthKey][memberName];
    }

    function hasBelumArrears(monthKey, memberName) {
      const row = getMemberMonthRow(monthKey, memberName);
      return ['w1', 'w2', 'w3', 'w4'].some((k) => row[k] === 'belum');
    }

    function getKasStatusMeta(status) {
      if (status === 'lunas') {
        return { label: 'Lunas', cls: 'bg-emerald-100 text-emerald-800 border-emerald-300 dark:bg-emerald-950/60 dark:text-emerald-300 dark:border-emerald-800' };
      }
      if (status === 'belum') {
        return { label: 'Belum', cls: 'bg-rose-100 text-rose-800 border-rose-300 dark:bg-rose-950/60 dark:text-rose-300 dark:border-rose-800' };
      }
      return { label: 'Tunggu', cls: 'bg-stone-100 text-slate-600 border-stone-300 dark:bg-white/10 dark:text-slate-300 dark:border-white/15' };
    }

    function computeKasSummary(filterMonth = null) {
      const months = filterMonth ? [filterMonth] : BULAN_KAS_OPTIONS.map((b) => b.key);
      let kasIncome = 0;
      months.forEach((mKey) => {
        (state.data.members || []).forEach((m) => {
          const row = getMemberMonthRow(mKey, m);
          ['w1', 'w2', 'w3', 'w4'].forEach((w) => {
            if (row[w] === 'lunas') kasIncome += NOMINAL_KAS_PER_MINGGU;
          });
        });
      });

      const trxList = (state.data.kasTransactions || []).filter((t) => (!filterMonth ? true : t.month === filterMonth));
      let extraIncome = 0;
      let expense = 0;
      let correction = 0;

      trxList.forEach((t) => {
        const amt = Number(t.amount) || 0;
        if (t.type === 'income') extraIncome += amt;
        else if (t.type === 'expense') expense += amt;
        else if (t.type === 'correction') correction += amt;
      });

      const totalIncome = kasIncome + extraIncome;
      const totalOut = expense + correction;
      const balance = totalIncome - totalOut;
      return { kasIncome, extraIncome, totalIncome, expense, correction, balance, trxList };
    }

    function adminCycleKasCell(monthKey, memberName, weekKey) {
      if (!isAdmin()) return;
      const row = getMemberMonthRow(monthKey, memberName);
      const prev = row[weekKey];
      const order = ['tunggu', 'lunas', 'belum'];
      const next = order[(order.indexOf(prev) + 1) % order.length];
      row[weekKey] = next;

      if (prev === 'lunas' && next !== 'lunas') {
        state.data.kasTransactions = state.data.kasTransactions || [];
        state.data.kasTransactions.unshift({
          id: 'trx-' + Date.now(),
          month: monthKey,
          date: getTodayInfo().isoDate,
          type: 'correction',
          category: 'Koreksi Pembatalan Kas',
          description: `Pembatalan status Lunas ${memberName} (${monthKey} ${weekKey.toUpperCase()})`,
          amount: NOMINAL_KAS_PER_MINGGU,
        });
        showToast(`Pembatalan ${memberName} dicatat (-${formatRupiah(NOMINAL_KAS_PER_MINGGU)}).`, 'info');
      } else {
        showToast(`${memberName} (${weekKey.toUpperCase()}): ${getKasStatusMeta(next).label}`, 'success');
      }

      saveData();
      renderAll();
    }

    function renderTugasPage() {
      const todayIso = getTodayInfo().isoDate;
      const q = (state.tugasSearch || '').trim().toLowerCase();
      const sorted = [...(state.data.assignments || [])].sort((a, b) =>
        String(a.deadline || '').localeCompare(String(b.deadline || ''))
      );

      const filtered = sorted.filter((t) => {

          !q ||
          t.title.toLowerCase().includes(q) ||
          t.subjectName.toLowerCase().includes(q) ||
          (t.description || '').toLowerCase().includes(q);
        const done = isMember() && (t.completedBy || []).includes(state.session.name);
        if (state.tugasFilter === 'done') return searchOk && done;
        if (state.tugasFilter === 'pending') return searchOk && !done;
        return searchOk;
      });

      return `
        <div class="space-y-5">

              <button type="button" onclick="state.tugasFilter='done'; renderAll();" class="px-3 py-1.5 rounded-xl text-xs font-bold ${state.tugasFilter === 'done' ? 'bg-brand-900 text-white' : 'bg-stone-100 dark:bg-white/10'}">Selesai</button>

                        <div class="p-4 sm:p-5 rounded-2xl bg-white dark:bg-[#170e11] border ${

                            ? 'border-rose-400 dark:border-rose-700'

                            ? 'border-amber-400 dark:border-amber-700'
                            : 'border-stone-200 dark:border-brand-900/40'

                                isOverdue ? 'text-rose-600' : isDueSoon ? 'text-amber-600' : 'text-slate-500'

                                      : 'bg-brand-900 hover:bg-brand-800 text-white'
                                  }">${done ? '✓ Selesai' : 'Tandai Selesai'}</button>`

                            }

                    .join('')

    function toggleTaskDone(taskId) {
      if (!isMember()) return;
      const task = (state.data.assignments || []).find((x) => x.id === taskId);
      if (!task) return;
      task.completedBy = task.completedBy || [];
      const idx = task.completedBy.indexOf(state.session.name);
      let isNowDone = false;
      if (idx >= 0) {
        task.completedBy.splice(idx, 1);
      } else {
        task.completedBy.push(state.session.name);
        isNowDone = true;
      }
      saveData();
      recordActivity(
        `${isNowDone ? 'Menyelesaikan' : 'Membatalkan status selesai'} tugas: ${task.title}`
      );
      renderAll();
      showToast('Status tugas diperbarui.', 'success');
    }

    function submitPiketPhotoUpload(e) {
      e.preventDefault();
      const fileInput = document.getElementById('pktFileInput');
      const file = fileInput?.files?.[0];
      if (!file || !file.type.startsWith('image/')) {
        showToast('Pilih file gambar yang valid (image/*).', 'error');
        return;
      }

      const day = document.getElementById('pktDayInput').value;
      const uploader = document.getElementById('pktUploaderInput').value.trim();
      const notes = document.getElementById('pktNotesInput').value.trim();

      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxW = 900;
          const scale = img.width > maxW ? maxW / img.width : 1;
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const compressedUrl = canvas.toDataURL('image/jpeg', 0.75);

          state.data.piketPhotos = state.data.piketPhotos || [];
          state.data.piketPhotos.unshift({
            id: 'pkt-' + Date.now(),
            date: getTodayInfo().isoDate,
            day,
            uploader,
            notes,
            imageUrl: compressedUrl,
          });
          saveData();
          renderAll();
          showToast('Foto dokumentasi piket berhasil diunggah!', 'success');
        };
        img.onerror = () => showToast('Gagal memproses gambar.', 'error');
        img.src = String(reader.result || '');
      };
      reader.readAsDataURL(file);
    }

        creator: state.session.name,
        members: sortAlphaAZ(picked),

    function deleteMemberGroup(groupId) {
      const grp = (state.data.memberGroups || []).find((g) => g.id === groupId);
      if (!grp) return;
      if (!isAdmin() && grp.creator !== state.session?.name) {
        showToast('Hanya pembuat grup atau Admin yang dapat menghapus grup.', 'error');
        return;
      }
      state.data.memberGroups = state.data.memberGroups.filter((g) => g.id !== groupId);
      if (state.selectedGroupId === groupId) {
        state.selectedGroupId = state.data.memberGroups[0]?.id || null;
      }
      saveData();
      recordActivity(`Menghapus grup "${grp.name}"`);
      renderAll();
      showToast(`Grup "${grp.name}" dihapus.`, 'info');
    }

    function submitGroupChatMessage(e, groupId) {
      e.preventDefault();
      if (!isMember()) {
        showToast('Pilih nama member terlebih dahulu untuk mengirim pesan grup.', 'error');
        return;
      }
      const input = document.getElementById('groupChatInput');
      const text = (input?.value || '').trim();
      const grp = (state.data.memberGroups || []).find((g) => g.id === groupId);
      if (!grp || !text) return;

      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      grp.messages = grp.messages || [];
      grp.messages.push({
        id: 'gm-' + Date.now(),
        sender: state.session.name,
        text,
        time: timeStr,
        date: getTodayInfo().isoDate,
      });

      saveData();
      recordActivity(`Mengirim pesan ke grup "${grp.name}"`);
      renderAll();

      const listEl = document.getElementById('groupChatMessagesList');
      if (listEl) listEl.scrollTop = listEl.scrollHeight;
    }

    function submitContactAdminMessage(e) {
      e.preventDefault();
      const sender = (document.getElementById('supportSenderInput')?.value || '').trim() || state.session?.name || 'Pengunjung';
      const topic = document.getElementById('supportTopicInput')?.value || 'Umum / Pertanyaan';
      const text = (document.getElementById('supportMessageInput')?.value || '').trim();
      if (!text) return;

      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      state.data.adminSupportMessages = state.data.adminSupportMessages || [];
      state.data.adminSupportMessages.unshift({
        id: 'sup-' + Date.now(),
        sender,
        role: state.session?.role || 'guest',
        topic,
        text,
        time: timeStr,
        date: getTodayInfo().isoDate,
        status: 'Terkirim ke Admin',
        replies: [],
      });

      state.data.notifications = state.data.notifications || [];
      state.data.notifications.unshift({
        id: 'notif-sup-' + Date.now(),
        text: `Pesan Hubungi Admin dari ${sender} (${topic}): ${text}`,
        time: 'Baru saja',
        unread: true,
      });

      saveData();
      recordActivity(`Mengirim pesan Hubungi Admin (${topic})`);
      renderAll();
      showToast('Pesan berhasil dikirim ke Admin!', 'success');
    }

    function submitAdminReplyToSupport(e, supportId, inputId) {
      e.preventDefault();
      if (!isAdmin()) {
        showToast('Hanya Admin yang dapat membalas pesan ini.', 'error');
        return;
      }
      const input = document.getElementById(inputId);
      const replyText = (input?.value || '').trim();
      const msg = (state.data.adminSupportMessages || []).find((m) => m.id === supportId);
      if (!msg || !replyText) return;

      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      msg.replies = msg.replies || [];
      msg.replies.push({
        id: 'rep-' + Date.now(),
        adminName: state.session?.name || 'Admin XII ECLIPSION',
        text: replyText,
        time: timeStr,
        date: getTodayInfo().isoDate,
      });
      msg.status = 'Dibalas Admin';

      state.data.notifications = state.data.notifications || [];
      state.data.notifications.unshift({
        id: 'notif-rep-' + Date.now(),
        text: `Admin membalas pesan dari ${msg.sender}: "${replyText}"`,
        time: 'Baru saja',
        unread: true,
      });

      saveData();
      recordActivity(`Admin membalas pesan dari ${msg.sender}`);
      renderAll();
      showToast(`Balasan terkirim ke ${msg.sender}!`, 'success');

    function admMarkBelumWeek(weekNum) {
      const mKey = state.adminKasMonth;
      const wKey = 'w' + weekNum;
      if (!state.data.kasByMonth[mKey]) state.data.kasByMonth[mKey] = {};
      state.data.members.forEach((m) => {
        if (!state.data.kasByMonth[mKey][m]) {
          state.data.kasByMonth[mKey][m] = { w1: 'tunggu', w2: 'tunggu', w3: 'tunggu', w4: 'tunggu' };
        }
        if (state.data.kasByMonth[mKey][m][wKey] !== 'lunas') {
          state.data.kasByMonth[mKey][m][wKey] = 'belum';
        }
      });
      saveData();
      renderAll();
      showToast(`Anggota yang belum lunas di Minggu ke ${weekNum} ditandai Belum.`, 'info');
    }

          <div><label class="block text-xs font-semibold mb-1">Isi</label><textarea id="eAnnContent" rows="3" required class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-brand-800 bg-white dark:bg-black/30 text-sm">${escapeHtml(a.content)}</textarea></div>
          <label class="flex items-center gap-2 text-xs font-semibold"><input type="checkbox" id="eAnnPin" ${a.pinned ? 'checked' : ''} /> Sematkan</label>
          <div class="flex justify-end gap-2"><button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-stone-100 dark:bg-white/10">Batal</button><button type="submit" class="px-4 py-2 rounded-xl text-xs font-bold bg-brand-900 text-white">Simpan</button></div>
        </form>
      `
      );
    }

    function submitEditAnn(e, id) {
      e.preventDefault();
      const idx = state.data.announcements.findIndex((x) => x.id === id);
      if (idx < 0) return;
      state.data.announcements[idx] = {
        ...state.data.announcements[idx],
        title: document.getElementById('eAnnTitle').value.trim(),
        content: document.getElementById('eAnnContent').value.trim(),
        pinned: document.getElementById('eAnnPin').checked,
      };
      saveData();
      closeModal();
      renderAll();
      showToast('Pengumuman diperbarui.', 'success');
    }

    function admDeleteAnn(id) {
      state.data.announcements = state.data.announcements.filter((x) => x.id !== id);
      saveData();
      renderAll();
      showToast('Pengumuman dihapus.', 'info');
    }

    function renderAdmMember() {
      const sorted = sortAlphaAZ(state.data.members);
      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <form onsubmit="admCreateMember(event)" class="p-5 rounded-2xl bg-white dark:bg-[#170e11] border border-stone-200 dark:border-brand-900/40 space-y-3 self-start">
            <h2 class="font-display font-bold text-base">Tambah Anggota Baru</h2>
            <p class="text-xs text-slate-500">Otomatis diurutkan A–Z pada kas, admin, dan piket.</p>
            <input type="text" id="admMemName" required placeholder="Nama lengkap anggota" class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-brand-800 bg-white dark:bg-black/30 text-sm" />
            <input type="text" id="admMemNis" placeholder="NIS (opsional)" class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-brand-800 bg-white dark:bg-black/30 text-sm" />
            <button type="submit" class="w-full py-2.5 rounded-xl bg-brand-900 text-white text-sm font-bold">Tambah Member</button>
          </form>

          <div class="lg:col-span-2 bg-white dark:bg-[#170e11] rounded-2xl border border-stone-200 dark:border-brand-900/40 p-5">
            <h3 class="font-display font-bold text-base mb-3">Daftar Member Terurut A–Z (${sorted.length})</h3>
            <div class="divide-y divide-stone-200 dark:divide-brand-900/30">
              ${sorted
                .map((m, idx) => {
                  const prof = (state.data.memberProfiles || []).find((p) => p.name === m);
                  return `
                  <div class="py-2.5 flex items-center justify-between gap-2 text-sm">
                    <div>
                      <span class="font-bold"><span class="text-xs text-slate-400 mr-2">${idx + 1}.</span>${escapeHtml(m)}</span>
                      ${prof?.nis ? `<span class="text-xs text-slate-400 ml-2">NIS: ${escapeHtml(prof.nis)}</span>` : ''}
                    </div>
                    <div class="flex gap-1.5">
                      <button type="button" onclick="openEditMemberModal(${idx})" class="px-2.5 py-1 rounded bg-stone-100 dark:bg-white/10 text-xs font-semibold">Edit</button>
                      <button type="button" onclick="admDeleteMember(${idx})" class="px-2.5 py-1 rounded bg-rose-100 text-rose-700 text-xs font-semibold">Hapus</button>
                    </div>
                  </div>
                `;
                })
                .join('')}
            </div>
          </div>
        </div>
      `;
    }

    function admCreateMember(e) {
      e.preventDefault();
      const name = document.getElementById('admMemName').value.trim();
      const nis = document.getElementById('admMemNis').value.trim();
      if (!name) return;
      if (!state.data.members.includes(name)) state.data.members.push(name);
      state.data.members = sortAlphaAZ(state.data.members);
      state.data.memberProfiles = state.data.memberProfiles || [];
      if (!state.data.memberProfiles.some((p) => p.name === name)) {
        state.data.memberProfiles.push({
          name,
          nis: nis || String(12000 + state.data.members.length),
          username: name.split(' ')[0].toLowerCase() + '.xii',
          status: 'Aktif',
        });
      }
      saveData();
      renderAll();
      showToast(`${name} ditambahkan (terurut A–Z).`, 'success');
    }

    function openEditMemberModal(sortedIdx) {
      const sorted = sortAlphaAZ(state.data.members);
      const oldName = sorted[sortedIdx];
      if (!oldName) return;
      openModal(
        'Edit Member',
        `
        <form onsubmit="submitEditMember(event, '${escapeHtml(oldName).replace(/'/g, "\\'")}')" class="space-y-3">
          <div><label class="block text-xs font-semibold mb-1">Nama Anggota</label><input type="text" id="eMemName" required value="${escapeHtml(oldName)}" class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-brand-800 bg-white dark:bg-black/30 text-sm" /></div>
          <div class="flex justify-end gap-2"><button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-stone-100 dark:bg-white/10">Batal</button><button type="submit" class="px-4 py-2 rounded-xl text-xs font-bold bg-brand-900 text-white">Simpan</button></div>
        </form>
      `
      );
    }

    function submitEditMember(e, oldName) {
      e.preventDefault();
      const newName = document.getElementById('eMemName').value.trim();
      if (!newName) return;
      state.data.members = sortAlphaAZ(state.data.members.map((m) => (m === oldName ? newName : m)));
      state.data.memberProfiles = (state.data.memberProfiles || []).map((p) =>
        p.name === oldName ? { ...p, name: newName } : p
      );
      Object.keys(state.data.kasByMonth || {}).forEach((mKey) => {
        if (state.data.kasByMonth[mKey][oldName]) {
          state.data.kasByMonth[mKey][newName] = state.data.kasByMonth[mKey][oldName];
          delete state.data.kasByMonth[mKey][oldName];
        }
      });
      HARI_LIST.forEach((d) => {
        state.data.piketSchedule[d] = sortAlphaAZ((state.data.piketSchedule[d] || []).map((m) => (m === oldName ? newName : m)));
      });
      saveData();
      closeModal();
      renderAll();
      showToast('Member diperbarui & diurutkan A–Z.', 'success');
    }

    function admDeleteMember(sortedIdx) {
      const sorted = sortAlphaAZ(state.data.members);
      const target = sorted[sortedIdx];
      if (!target) return;
      state.data.members = sortAlphaAZ(state.data.members.filter((m) => m !== target));
      state.data.memberProfiles = (state.data.memberProfiles || []).filter((p) => p.name !== target);
      HARI_LIST.forEach((d) => {
        state.data.piketSchedule[d] = sortAlphaAZ((state.data.piketSchedule[d] || []).filter((m) => m !== target));
      });
      saveData();
      renderAll();
      showToast(`${target} dihapus.`, 'info');
    }

    // =========================================================================
    // 15. FOOTER & MASTER RENDER
    // =========================================================================
    function renderFooter() {
      return `
        <footer class="mt-12 border-t border-stone-200 dark:border-brand-900/40 bg-white dark:bg-[#140b0e] py-6 px-4 sm:px-6 text-xs text-slate-600 dark:text-slate-400">
          <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <div>
              <span class="font-display font-bold text-slate-900 dark:text-white">EizyEduEclipsion</span> • Portal Resmi Kelas XII ECLIPSION
            </div>
            <div class="flex flex-wrap items-center gap-3">
              <a
                href="https://www.instagram.com/xii.eclipsion/"
                target="_blank"
                rel="noopener noreferrer"
                class="inline-flex items-center gap-1.5 font-semibold text-brand-900 dark:text-brand-300 hover:underline"
              >
                <i data-lucide="instagram" class="w-4 h-4"></i>
                <span>@xii.eclipsion</span>
              </a>
              <span>•</span>
              <span>Penyimpanan Lokal (localStorage)</span>
            </div>
          </div>
        </footer>
      `;
    }

    function renderActiveView() {
      let content = '';
      switch (state.activePage) {
        case 'home':
          content = renderHomePage();
          break;
        case 'jadwal':
          content = renderJadwalPage();
          break;
        case 'mapel':
          content = renderMapelPage();
          break;
        case 'tugas':
          content = renderTugasPage();
          break;
        case 'kas':
          content = renderKasPage();
          break;
        case 'piket':
          content = renderPiketPage();
          break;
        case 'chat':
          content = renderChatPage();
          break;
        case 'admin':
          content = renderAdminPage();
          break;
        default:
          content = renderHomePage();
          break;
      }
      return `<div key="${escapeHtml(state.activePage)}" class="smooth-view space-y-6">${content}</div>`;
    }

    function updateScrollProgress() {
      const bar = document.getElementById('scrollProgressBar');
      if (!bar) return;
      const doc = document.documentElement;
      const maxScroll = doc.scrollHeight - doc.clientHeight;
      const ratio = maxScroll > 0 ? Math.min(1, Math.max(0, window.scrollY / maxScroll)) : 0;
      bar.style.transform = `scaleX(${ratio})`;
    }

    function renderAll() {
      const root = document.getElementById('app');
      const edgeTab = document.getElementById('edgeNavTab');
      if (!hasEnteredPortal()) {
        if (edgeTab) edgeTab.classList.add('hidden');
        root.innerHTML = renderPreEntryGate();
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
        updateScrollProgress();
        return;
      }
      if (edgeTab) edgeTab.classList.remove('hidden');
      root.innerHTML = `
        ${renderHeader()}
        <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-6">
          ${renderActiveView()}
        </main>
        ${renderFooter()}
      `;
      renderDrawer();
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
      updateRealtimeClockWidgets();
      updateScrollProgress();
    }

    setInterval(updateRealtimeClockWidgets, 1000);
    window.addEventListener('scroll', updateScrollProgress, { passive: true });
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      renderAll();
    });
    if (document.readyState !== 'loading') {
      initTheme();
      recordActivity('Membuka sesi portal', { incrementVisit: true });
      renderAll();
    }
  </script>
</body>
</html>
